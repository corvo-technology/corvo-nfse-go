name: Release

# Go modules are published by the tag itself (git tag v0.1.1 && git push origin v0.1.1);
# `go get github.com/corvo-technology/corvo-nfse-go@v0.1.1` resolves it. This workflow checks the
# tag and creates the GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: The tag must match the SDK version
        run: |
          VERSION=$(grep -m1 'const Version' client.go | cut -d'"' -f2)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; }

      - name: Test
        run: go test ./...

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
